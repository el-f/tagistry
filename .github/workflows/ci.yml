name: gate

# Branches only: a bare on-push also fires for tag pushes, running the gate twice when cutting a release.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a SHA: a tag is mutable, and whoever moves it runs arbitrary code on the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked # a PR that edits pyproject without re-locking fails here, not silently
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy # files = src + tests (pyproject)
      - run: uv run pytest -q --block-network --cov=tagistry --cov-report=term-missing --cov-fail-under=85
      # Same runner, not a second job: a broken console script only shows up after someone installs the wheel.
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl tagistry --version
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import pathlib,tagistry;assert (pathlib.Path(tagistry.__file__).parent/'py.typed').is_file()"
