version: 2
updates:
  # Solo repo: one grouped PR per ecosystem per month; security fixes still arrive separately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
